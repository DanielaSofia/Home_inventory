{% load static %}
<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %}
        Gestão da Casa
      {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="{% static 'inventory/css/ui-revamp.css' %}" rel="stylesheet" />
    {% block head %}
    {% endblock %}
  </head>
  <body>
    {% include 'inventory/_sidebar.html' %}

    <main class="menu-main">
      <div class="container container-main">
      {% block content %}
      {% endblock %}
      </div>
    </main>

    <footer class="bg-white border-top py-3 mt-auto">
      <div class="container text-muted small">© Gestão da Casa — interface remodelada</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}
    {% endblock %}

  </body>
</html>
