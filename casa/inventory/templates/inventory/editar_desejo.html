{% extends 'inventory/base.html' %}
{% block title %}
  Editar Desejo — Gestão da Casa
{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card form-card p-4">
        <span class="eyebrow">PLANEAMENTO</span>
        <h1 class="page-title mb-1">Editar desejo</h1>
        <p class="page-subtitle mb-4">Mantenha a sua lista de ideias atualizada.</p>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'desejos' %}" class="btn btn-outline-secondary">Cancelar</a>
            <button class="btn btn-primary">Guardar alterações</button>
          </div>
        </form>
        <form method="post" action="{% url 'apagar_desejo' form.instance.id %}" class="mt-3">
          {% csrf_token %}
          <button class="btn btn-outline-danger" onclick="return confirm('Apagar este desejo?')">Apagar desejo</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
